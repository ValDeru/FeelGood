<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column (max 640px) with a fixed bottom tab bar; large type and 56px+ touch targets for 75+ eyes and hands.
   Palette: Val's portfolio pattern library (cream, bark browns, sage, peach, amber, sky), leaning on its green error-page palette. */
:root {
  --bg: #EEF4EE;          /* sage-50 */
  --surface: #FCF6EA;     /* cream */
  --ink: #381800;         /* bark-800: titles */
  --body: #582700;        /* bark-650: running text */
  --muted: #8D4F2B;       /* bark-600 / terra-deep: secondary text, 5.9:1 */
  --line: #B5CCB6;        /* sage-light hairlines */
  --edge: #557E5D;        /* sage-dark: outlines and card top edges */
  --accent: #406B49;      /* sage-darker: filled buttons, green text */
  --accent-hover: #345A3C;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5E7D8; /* sage-100 */
  --band: #90AD91;        /* sage: coloured section */
  --warm: #8D4F2B; --warm-soft: #FFE2CF; --peach: #FFCFAF; --peach-edge: #F9B782;
  --amber: #94671F; --amber-soft: #FFF1D6; --sky: #2F5D6E; --sky-soft: #DCEBF1;
  --ok: #406B49; --ok-soft: #D5E7D8; --danger: #A32000; --danger-soft: #FFE2CF; --cta: #C92800;
  --focus: #381800;
  --c-red: #C92800; --c-blue: #1E5BC6; --c-green: #2E7D32; --c-yellow: #94671F;
  --f-body: "Mulish", "Segoe UI", system-ui, sans-serif;
  --f-head: "Space Grotesk", "Mulish", system-ui, sans-serif;
  --scale: 1; --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141B16; --surface: #1D2720; --ink: #FCF6EA; --body: #F3E6D4; --muted: #E3C6A6; --line: #34473A; --edge: #90AD91;
  --accent: #B5CCB6; --accent-hover: #D5E7D8; --accent-ink: #1B2A1F; --accent-soft: #2A3D2F; --band: #2F4636;
  --warm: #F9B782; --warm-soft: #3A2A1F; --peach: #4A3020; --peach-edge: #DF9263; --amber: #E8BE73; --amber-soft: #3A3020; --sky: #A3CCDB; --sky-soft: #1F3138;
  --ok: #B5CCB6; --ok-soft: #2A3D2F; --danger: #FFB4A0; --danger-soft: #3D2220; --cta: #FF8A6B; --focus: #FFEBD2;
  --c-red: #FF7B6B; --c-blue: #7EB0FF; --c-green: #7ED38A; --c-yellow: #F2C94C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141B16; --surface: #1D2720; --ink: #FCF6EA; --body: #F3E6D4; --muted: #E3C6A6; --line: #34473A; --edge: #90AD91;
  --accent: #B5CCB6; --accent-hover: #D5E7D8; --accent-ink: #1B2A1F; --accent-soft: #2A3D2F; --band: #2F4636;
  --warm: #F9B782; --warm-soft: #3A2A1F; --peach: #4A3020; --peach-edge: #DF9263; --amber: #E8BE73; --amber-soft: #3A3020; --sky: #A3CCDB; --sky-soft: #1F3138;
  --ok: #B5CCB6; --ok-soft: #2A3D2F; --danger: #FFB4A0; --danger-soft: #3D2220; --cta: #FF8A6B; --focus: #FFEBD2;
  --c-red: #FF7B6B; --c-blue: #7EB0FF; --c-green: #7ED38A; --c-yellow: #F2C94C; color-scheme: dark; }
* { box-sizing: border-box; }
html { font-size: calc(19px * var(--scale)); }
body { margin: 0; background: var(--bg); color: var(--body); font-family: var(--f-body); line-height: 1.5; -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.75rem; font-weight: 700; } h2 { font-size: 1.3rem; font-weight: 600; } h3 { font-size: 1.1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--muted); text-underline-offset: 3px; }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topin { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--f-head); font-weight: 700; font-size: 1.15rem; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand i { width: 14px; height: 14px; border-radius: 50%; background: var(--edge); box-shadow: 9px 0 0 var(--peach-edge); margin-right: 9px; }
.whobtn { font-weight: 700; color: var(--ink); background: var(--accent-soft); border: 1px solid var(--edge); border-radius: 999px; padding: 8px 16px; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
main { max-width: 640px; margin: 0 auto; padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.eyebrow { align-self: flex-start; font-size: .85rem; letter-spacing: .03em; font-weight: 600; color: var(--ink); border-bottom: 2px solid var(--peach-edge); padding-bottom: 2px; }
.row { display: flex; gap: 10px; align-items: center; } .row.wrap, .card .row { flex-wrap: wrap; }
.note { background: var(--warm-soft); color: var(--ink); padding: 12px 14px; border-radius: var(--r); font-size: .92rem; }
.card { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink); text-decoration: none; min-width: 0; }
.btn { font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 10px 18px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; transition: background-color .2s; text-decoration: none; line-height: 1.2; }
.btn.primary { background: var(--accent); color: var(--accent-ink); } .btn.primary:hover { background: var(--accent-hover); }
.btn.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--edge); } .btn.ghost:hover { background: var(--accent-soft); }
.btn.warn { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.btn.big { min-height: 64px; font-size: 1.1rem; width: 100%; }
.btn.huge { min-height: 120px; font-size: 2.4rem; width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.backbtn { align-self: flex-start; min-height: 48px; }
/* Today */
.hello .date { color: var(--muted); text-transform: capitalize; }
.safety { background: var(--surface); border: 2px solid var(--peach-edge); border-top-width: 6px; border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.safety .stop { background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: 10px; font-weight: 700; }
.summary { display: flex; justify-content: space-between; align-items: center; gap: 16px; background: var(--band); color: var(--ink); border-radius: var(--r); padding: 18px; }
.summary .eyebrow { color: inherit; border-color: var(--surface); }
.summary .focus { font-family: var(--f-head); font-size: 1.6rem; font-weight: 700; }
.meter { position: relative; text-align: right; display: flex; flex-direction: column; align-items: flex-end; min-width: 110px; }
.meter b { font-family: var(--f-head); font-size: 2rem; line-height: 1; }
.meter span { font-size: .85rem; }
.meter i { display: block; width: 100%; height: 10px; margin-top: 8px; border-radius: 5px; background: linear-gradient(90deg, var(--ink) calc(var(--p) * 100%), var(--surface) 0); }
.exlist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.excard { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.excard.done { background: var(--ok-soft); border-color: var(--ok); }
.excard.done .exname { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.exhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exname { font-family: var(--f-head); font-size: 1.2rem; font-weight: 600; color: var(--ink); text-decoration: none; }
.dose { color: var(--muted); font-weight: 700; }
.excard .row { flex-wrap: wrap; margin-top: 4px; }
.chip { font-size: .85rem; font-weight: 700; padding: 3px 12px; border-radius: 999px; background: var(--surface); color: var(--accent); border: 1px solid var(--edge); }
.chip.plain { background: var(--warm-soft); border-color: transparent; color: var(--body); }
.chip.cat-balance { color: var(--amber); border-color: var(--amber); } .chip.cat-posture { color: var(--sky); border-color: var(--sky); } .chip.cat-pilates, .chip.cat-yoga, .chip.cat-jivamukti { color: var(--warm); border-color: var(--peach-edge); }
.chip.cat-strength { background: var(--accent-soft); }
.chip.cat-custom { background: var(--peach); color: var(--ink); border-color: var(--peach-edge); }
.fam { color: var(--peach-edge); display: inline-flex; } .fam .ic { fill: currentColor; }
.sup { color: var(--muted); display: inline-flex; }
.walk .exhead { color: var(--accent); }
.walked { font-size: 1.1rem; } .walked b { font-family: var(--f-head); font-size: 1.6rem; }
.bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.gamecard { border: 1px solid var(--edge); border-top: 5px solid var(--edge); } .gamecard .btn { align-self: flex-start; }
.tip { background: var(--warm-soft); border-color: var(--peach-edge); }
/* Detail */
.detail h1 { font-size: 2rem; }
.how { font-size: 1.2rem; line-height: 1.6; max-width: 34em; }
.warnline { display: flex; gap: 10px; align-items: center; background: var(--amber-soft); color: var(--ink); border: 1px solid var(--amber); font-weight: 700; padding: 12px 14px; border-radius: 12px; }
.dosebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px; } .dosebox p:last-child { font-family: var(--f-head); font-size: 1.4rem; font-weight: 600; }
.timer { text-align: center; } .timer b { font-family: var(--f-head); font-size: 4rem; color: var(--accent); font-variant-numeric: tabular-nums; }
/* Filters */
.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.fchip { font: inherit; font-weight: 700; white-space: nowrap; min-height: 48px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--edge); background: var(--surface); color: var(--ink); cursor: pointer; }
.fchip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* Who */
.people { display: grid; gap: 12px; }
.person { font: inherit; display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: var(--r); border: 1px solid var(--edge); border-top: 5px solid var(--edge); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; min-height: 88px; }
.person b { font-family: var(--f-head); font-size: 1.4rem; display: block; } .person small { color: var(--muted); font-size: .95rem; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-head); font-size: 1.5rem; font-weight: 700; flex: none; }
/* Brain */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.game .chip { align-self: flex-start; } .lv { color: var(--muted); font-weight: 700; } .okt { color: var(--ok); display: inline-flex; align-items: center; gap: 4px; }
.gtitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.gamebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; min-height: 260px; }
.gstat { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.memgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 8px; width: 100%; max-width: 460px; }
.mcard { aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 2px solid var(--edge); background: var(--band); font-size: 2rem; cursor: pointer; color: var(--ink); }
.mcard.up { background: var(--surface); } .mcard.matched { background: var(--ok-soft); border-color: var(--ok); }
.slots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.slot { width: 2.2rem; height: 2.8rem; border-bottom: 3px solid var(--accent); font-family: var(--f-head); font-size: 1.6rem; font-weight: 700; display: grid; place-items: center; }
.tiles, .pad { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; max-width: 320px; }
.tile { font-family: var(--f-head); font-size: 1.6rem; font-weight: 700; width: 3.2rem; height: 3.2rem; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.pad .tile { width: 100%; height: 3.6rem; } .tile.wide { grid-column: span 3; font-size: 1rem; }
.tile:disabled { opacity: .25; }
.msg { min-height: 1.6em; font-weight: 700; color: var(--accent); }
.sum { font-family: var(--f-head); font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; } .opts.two { grid-template-columns: 1fr 1fr; }
.opt { background: var(--bg); color: var(--ink); border-color: var(--line); font-size: 1.4rem; min-height: 72px; }
.stroop { font-family: var(--f-head); font-size: 3rem; font-weight: 700; letter-spacing: .04em; }
.digit { font-family: var(--f-head); font-size: 5rem; font-weight: 700; color: var(--accent); min-height: 1.3em; line-height: 1.3; font-variant-numeric: tabular-nums; }
.digit.small-digit { font-size: 3rem; }
.catname { font-family: var(--f-head); font-size: 1.8rem; font-weight: 700; } .catname small { display: block; font-size: 1.1rem; color: var(--muted); font-weight: 500; } .catname b { color: var(--accent); font-size: 1.6rem; }
.result { display: flex; flex-direction: column; gap: 12px; align-items: center; } .big-num { font-family: var(--f-head); font-size: 2.4rem; font-weight: 700; color: var(--accent); }
/* Progress */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.stat .num b { font-family: var(--f-head); font-size: 2rem; font-variant-numeric: tabular-nums; } .stat .num span { color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 180px; align-items: end; }
.chart .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart .col i { width: 70%; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 3px; }
.chart .v { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; } .chart .d { font-weight: 700; color: var(--muted); }
.guide p { max-width: 36em; }
/* Family */
.care { gap: 14px; }
.formbox { border-top: 1px solid var(--line); padding-top: 14px; gap: 10px; }
label { font-weight: 700; }
input, select, textarea { font: inherit; font-size: 1rem; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-height: 52px; }
textarea { min-height: 80px; resize: vertical; }
fieldset { border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; margin: 0; } legend { font-weight: 700; padding: 0 6px; }
.radio { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; min-height: 44px; padding-top: 8px; }
.radio input { width: 24px; height: 24px; min-height: 0; flex: none; margin: 0; accent-color: var(--accent); }
.radio small { display: block; color: var(--muted); font-size: .85rem; }
.grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; } .grid2 > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mgr { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; } .mgr summary { font-weight: 700; cursor: pointer; min-height: 48px; display: flex; align-items: center; }
.mgr ul { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-direction: column; } .mgr li { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
.mname { min-width: 0; flex: 1 1 12em; } .struck { text-decoration: line-through; color: var(--muted); }
.mini { font: inherit; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.mini .ic { width: 1em; height: 1em; } .mini.on { background: var(--peach); color: var(--ink); border-color: var(--peach-edge); } .mini.on .ic { fill: currentColor; }
.mini.warn.on { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.flash { background: var(--ok-soft); color: var(--ok); font-weight: 700; padding: 10px 14px; border-radius: 10px; }
.err { color: var(--danger); font-weight: 700; }
/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 68px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 700; }
.tab .ic { width: 1.6rem; height: 1.6rem; } .tab.on { color: var(--accent); background: var(--accent-soft); } .tab.on .ic { stroke-width: 2.5; }
@media (min-width: 700px) { .tabs { max-width: 640px; margin: 0 auto; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }
@media (max-width: 380px) { .summary { flex-direction: column; align-items: flex-start; } .meter { align-items: flex-start; text-align: left; width: 100%; } .grid2 { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main id="main" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Menu"></nav>
